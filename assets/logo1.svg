<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    </style>
    <clipPath id="circle-clip">
      <circle cx="250" cy="250" r="248"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <circle cx="250" cy="250" r="250" fill="#ffffff"/>

  <!-- Outer thick blue ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#5d82a8" stroke-width="16"/>

  <!-- Inner thin gold ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#c9a96e" stroke-width="1.6"/>

  <!-- ── GOLD DOTS (between rings, left & right) ── -->
  <circle cx="28" cy="238" r="4.5" fill="#c9a96e"/>
  <circle cx="28" cy="251" r="4.5" fill="#c9a96e"/>
  <circle cx="28" cy="264" r="4.5" fill="#c9a96e"/>
  <circle cx="472" cy="238" r="4.5" fill="#c9a96e"/>
  <circle cx="472" cy="251" r="4.5" fill="#c9a96e"/>
  <circle cx="472" cy="264" r="4.5" fill="#c9a96e"/>

  <!-- ── LION ── -->
  <!-- Outer mane oval -->
  <ellipse cx="250" cy="107" rx="71" ry="67" fill="none" stroke="#c9a96e" stroke-width="2"/>

  <!-- Mane flowing hair lines -->
  <path d="M185 76 Q181 61 191 49" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M202 47 Q216 37 230 43" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M250 40 Q266 35 279 44" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M308 54 Q320 66 319 82" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M319 107 Q322 122 311 135" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M296 160 Q279 169 261 168" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M239 168 Q221 168 204 159" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M183 135 Q175 122 181 107" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Head circle (white to mask mane) -->
  <circle cx="250" cy="107" r="45" fill="#ffffff"/>
  <circle cx="250" cy="107" r="45" fill="none" stroke="#c9a96e" stroke-width="1.4"/>

  <!-- Left eye (almond) -->
  <path d="M231 99 Q237 93 244 99 Q237 105 231 99Z" fill="#c9a96e"/>
  <circle cx="237" cy="99" r="2.2" fill="rgba(255,255,255,0.6)"/>
  <!-- Right eye -->
  <path d="M256 99 Q263 93 269 99 Q263 105 256 99Z" fill="#c9a96e"/>
  <circle cx="263" cy="99" r="2.2" fill="rgba(255,255,255,0.6)"/>

  <!-- Nose (inverted triangle / heart shape) -->
  <path d="M246 115 L250 121 L254 115 Q250 111 246 115Z" fill="#c9a96e"/>

  <!-- Mouth -->
  <path d="M244 124 Q250 130 256 124" fill="none" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="208" y1="113" x2="237" y2="115" stroke="#c9a96e" stroke-width="0.9"/>
  <line x1="208" y1="119" x2="237" y2="120" stroke="#c9a96e" stroke-width="0.9"/>
  <line x1="263" y1="115" x2="292" y2="113" stroke="#c9a96e" stroke-width="0.9"/>
  <line x1="263" y1="120" x2="292" y2="119" stroke="#c9a96e" stroke-width="0.9"/>

  <!-- Ledge bar -->
  <line x1="180" y1="167" x2="320" y2="167" stroke="#c9a96e" stroke-width="2.5"/>

  <!-- Left paw -->
  <ellipse cx="200" cy="167" rx="22" ry="9" fill="#ffffff" stroke="#c9a96e" stroke-width="1.4"/>
  <line x1="184" y1="172" x2="182" y2="180" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="193" y1="174" x2="192" y2="182" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="203" y1="174" x2="204" y2="182" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="213" y1="172" x2="215" y2="180" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right paw -->
  <ellipse cx="300" cy="167" rx="22" ry="9" fill="#ffffff" stroke="#c9a96e" stroke-width="1.4"/>
  <line x1="284" y1="172" x2="282" y2="180" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="293" y1="174" x2="292" y2="182" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="303" y1="174" x2="304" y2="182" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="313" y1="172" x2="315" y2="180" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── LEAF BRANCHES ── -->
  <!-- Left stem -->
  <path d="M78 242 C74 224 77 205 85 186" fill="none" stroke="#7a9bbf" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left leaves -->
  <ellipse cx="76" cy="234" rx="12" ry="17" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(-22 76 234)"/>
  <ellipse cx="78" cy="216" rx="12" ry="17" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(-13 78 216)"/>
  <ellipse cx="83" cy="199" rx="11" ry="15" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(-5 83 199)"/>
  <ellipse cx="85" cy="223" rx="11" ry="15" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(24 85 223)"/>
  <ellipse cx="89" cy="207" rx="10" ry="14" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(15 89 207)"/>

  <!-- Right stem -->
  <path d="M422 242 C426 224 423 205 415 186" fill="none" stroke="#7a9bbf" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right leaves -->
  <ellipse cx="424" cy="234" rx="12" ry="17" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(22 424 234)"/>
  <ellipse cx="422" cy="216" rx="12" ry="17" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(13 422 216)"/>
  <ellipse cx="417" cy="199" rx="11" ry="15" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(5 417 199)"/>
  <ellipse cx="415" cy="223" rx="11" ry="15" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(-24 415 223)"/>
  <ellipse cx="411" cy="207" rx="10" ry="14" fill="none" stroke="#7a9bbf" stroke-width="1.3" transform="rotate(-15 411 207)"/>

  <!-- ── TEXT: Crave ── -->
  <text x="250" y="258"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="83"
        font-weight="700"
        fill="#5d82a8">Crave</text>

  <!-- ── TEXT: Balance ── -->
  <text x="250" y="343"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="83"
        font-weight="700"
        fill="#5d82a8">Balance</text>

  <!-- ── BY MELS ── -->
  <line x1="98"  y1="377" x2="158" y2="377" stroke="#c9a96e" stroke-width="1.6"/>
  <text x="250" y="384"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="700"
        letter-spacing="7"
        fill="#c9a96e">BY MELS</text>
  <line x1="342" y1="377" x2="402" y2="377" stroke="#c9a96e" stroke-width="1.6"/>

  <!-- ── BOTTOM: rays + heart ── -->
  <line x1="226" y1="430" x2="218" y2="416" stroke="#5d82a8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="237" y1="434" x2="232" y2="420" stroke="#5d82a8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="250" y1="436" x2="250" y2="421" stroke="#5d82a8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="263" y1="434" x2="268" y2="420" stroke="#5d82a8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="274" y1="430" x2="282" y2="416" stroke="#5d82a8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Heart -->
  <path d="M250 452 C250 452 240 443 240 437.5 C240 433 244 431 250 437.5 C256 431 260 433 260 437.5 C260 443 250 452 250 452Z" fill="#5d82a8"/>
</svg>
